name: ci
on: [push, pull_request]

jobs:
  unit-and-local-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: make test
      - run: make smoke-local SCENARIO=network-anomaly
      - run: make smoke-local SCENARIO=predictive-maintenance

  kind-smoke:
    runs-on: ubuntu-latest
    needs: unit-and-local-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - run: make up
      - run: make smoke
      - run: make roi
      - name: Debug on failure
        if: failure()
        run: kubectl -n ttv get pods -o wide; kubectl -n ttv logs deploy/model-service --tail=100
