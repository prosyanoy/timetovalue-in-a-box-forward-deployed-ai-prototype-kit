apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels: {{- include "ttv.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-m", "8222"]
          ports: [{ containerPort: 4222 }, { containerPort: 8222 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8222 }, periodSeconds: 2 }
          resources: { requests: { cpu: 25m, memory: 32Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: nats }
  ports: [{ name: client, port: 4222 }]
