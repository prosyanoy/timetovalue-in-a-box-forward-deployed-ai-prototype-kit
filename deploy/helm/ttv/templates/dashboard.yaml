apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: {{- include "ttv.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: dashboard } }
  template:
    metadata: { labels: { app: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-c", "from ttv.service import dashboard_main; dashboard_main()"]
          env:
            - name: MODEL_URL
              value: "http://model-service:8081"
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 2 }
          resources: { requests: { cpu: 25m, memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  selector: { app: dashboard }
  ports: [{ port: 8080, targetPort: 8080, nodePort: {{ .Values.service.dashboardNodePort }} }]
